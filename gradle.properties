# Выделяем память JVM сборщика и включаем UTF-8
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Использовать AndroidX вместо устаревших библиотек поддержки
android.useAndroidX=true
# Официальный стиль кода Kotlin
kotlin.code.style=official
# R-класс содержит только ресурсы текущего модуля (ускоряет сборку)
android.nonTransitiveRClass=true
